{% extends "base.html" %}
{% block title %}Apskates objekti{% endblock %}
{% block content %}
  <h1>Apskates objekti</h1>
  <div class="mb-4">
    <a href="/pilsetas/{{id}}/objekti/add" class="btn btn-primary">Pievienot objektu</a>
    <a href="/pilsetas" class="btn">Atpakaļ uz pilsētām</a>
  </div>
  <div class="grid">
    {% for objekts in objekti %}
      <div class="card">
        <img src="{{ url_for('static', filename='images/objekti/' + objekts['foto_url'])}}" alt="Apskates objekts" style="width: 100%; height: 250px; object-fit: cover; border-radius: 0.375rem; margin-bottom: 1rem;">
      </div>
    {% endfor %}
  </div>
{% endblock %}
