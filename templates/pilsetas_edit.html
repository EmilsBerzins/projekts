{% extends "base.html" %}
{% block title %}Rediģēt {{ pilseta["nosaukums"] }}{% endblock %}
{% block content %}
  <h1>Rediģēt {{ pilseta["nosaukums"] }}</h1>
  <form method="post" action="/pilsetas/{{ pilseta['id'] }}/edit">
    <div class="form-group">
      <label for="nosaukums">Nosaukums: </label>
      <input type="text" name="nosaukums" id="nosaukums" value="{{ pilseta['nosaukums'] }}" required>
    </div>
    <div class="form-group">
      <label for="iedzivotaji">Iedzīvotāju skaits: </label>
      <input type="number" name="iedzivotaji" id="iedzivotaji" value="{{ pilseta['iedzivotaji'] }}" required>
    </div>
    <div class="form-group">
      <label for="platiba">Platība (km²): </label>
      <input type="number" name="platiba" id="platiba" value="{{ pilseta['platiba'] }}" required>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-success">Saglabāt izmaiņas</button>
      <a href="/pilsetas/{{ pilseta['id'] }}" class="btn btn-secondary">Atcelt</a>
    </div>
  </form>
{% endblock %}
