{% extends "base.html" %}
{% block title %}Pilsētas{% endblock %}
{% block content %}
  <h1>Pilsētas</h1>
  <div class="mb-4">
    <a href="/pilsetas/create" class="btn btn-primary">Pievienot pilsētu</a>
  </div>
  <div class="grid">
    {% for pilseta in pilsetas %}
      <div class="card">
        <h3>{{pilseta["nosaukums"]}}</h3>
        <a href="/pilsetas/{{pilseta['id']}}" class="btn btn-primary btn-small">Apskatīt aprakstu</a>
      </div>
    {% endfor %}
  </div>
{% endblock %}
